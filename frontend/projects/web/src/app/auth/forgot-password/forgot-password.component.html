<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset OTP</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="you@example.com"
          [class.invalid]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
        />
      </div>

      <div class="form-error" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="forgotForm.invalid || isLoading">
        <span *ngIf="!isLoading">SEND OTP <span class="arrow">→</span></span>
        <span *ngIf="isLoading">SENDING...</span>
      </button>
    </form>

    <div class="auth-card__footer">
      <p>Remembered your password? <a routerLink="/auth/login">Log in</a></p>
    </div>
  </div>
</div>
