<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h2>Reset Password</h2>
      <p>Enter your OTP and new password</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="you@example.com"
          [class.invalid]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched"
          readonly
        />
      </div>

      <div class="form-group">
        <label for="otp">6-Digit OTP</label>
        <input 
          type="text" 
          id="otp" 
          formControlName="otp" 
          placeholder="123456"
          maxlength="6"
          [class.invalid]="resetForm.get('otp')?.invalid && resetForm.get('otp')?.touched"
        />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div style="position: relative;">
          <input 
            id="newPassword" 
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="newPassword" 
            placeholder="Minimum 6 characters"
            [class.invalid]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched"
            style="width: 100%; padding-right: 40px;"
          />
          <button type="button" (click)="togglePasswordVisibility()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-muted); display: flex; align-items: center; justify-content: center;">
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </button>
        </div>
      </div>

      <div class="form-error" *ngIf="error">
        {{ error }}
      </div>

      <div class="form-success" *ngIf="successMessage" style="color: var(--color-teal); margin-bottom: 20px; font-weight: 600;">
        {{ successMessage }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="resetForm.invalid || isLoading">
        <span *ngIf="!isLoading">RESET PASSWORD <span class="arrow">→</span></span>
        <span *ngIf="isLoading">RESETTING...</span>
      </button>
    </form>

    <div class="auth-card__footer">
      <p><a routerLink="/auth/login">Back to Login</a></p>
    </div>
  </div>
</div>
