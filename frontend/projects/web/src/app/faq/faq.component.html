<section id="faq" class="faq-section section">
    <div class="container faq-layout">
        <header class="faq-heading reveal">
            <p class="label">FREQUENTLY ASKED QUESTIONS</p>
            <h2>Clear answers before you begin.</h2>
            <p>Everything you need to know about building, editing and exporting your resume.</p>
        </header>

        <div class="accordion reveal reveal-delay-1">
            <article class="accordion__item" *ngFor="let item of faqItems; let i = index" [class.open]="openIndex === i">
                <h3>
                    <button class="accordion__trigger"
                            (click)="toggle(i)"
                            [attr.aria-expanded]="openIndex === i"
                            [attr.aria-controls]="'faq-answer-' + i"
                            [attr.id]="'faq-question-' + i"
                            type="button">
                        <span class="accordion__question">{{ item.question }}</span>
                        <span class="accordion__icon" [class.open]="openIndex === i" aria-hidden="true">+</span>
                    </button>
                </h3>
                <div class="accordion__panel"
                     [class.open]="openIndex === i"
                     [attr.id]="'faq-answer-' + i"
                     [attr.aria-labelledby]="'faq-question-' + i"
                     role="region">
                    <div class="accordion__answer-wrap">
                        <p class="accordion__answer">{{ item.answer }}</p>
                    </div>
                </div>
            </article>
        </div>
    </div>
</section>
