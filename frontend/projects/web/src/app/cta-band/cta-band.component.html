<section id="cta" class="cta-section section">
    <div class="container">
        <div class="cta-card reveal">
            <div class="cta-card__glow" aria-hidden="true"></div>
            <div class="cta-card__copy">
                <p class="label label--light">READY TO STAND OUT?</p>
                <h2>Build a resume that finally feels like you.</h2>
                <p>Start with your experience. ResumeFlow will help you shape the story, improve the details and prepare it for the next opportunity.</p>
                <div class="cta-card__actions">
                    <a routerLink="/auth/signup" class="btn btn-primary">CREATE MY RESUME <span class="arrow">→</span></a>
                    <a routerLink="/" fragment="templates" class="btn btn-outline">VIEW TEMPLATES</a>
                </div>
            </div>

            <div class="cta-visual" aria-hidden="true">
                <div class="cta-paper cta-paper--back"></div>
                <div class="cta-paper cta-paper--front">
                    <span class="cta-paper__name"></span>
                    <span class="cta-paper__role"></span>
                    <span class="cta-paper__rule"></span>
                    <span class="cta-paper__line"></span>
                    <span class="cta-paper__line"></span>
                    <span class="cta-paper__line cta-paper__line--short"></span>
                    <span class="cta-paper__rule"></span>
                    <span class="cta-paper__line"></span>
                    <span class="cta-paper__line cta-paper__line--short"></span>
                </div>
                <div class="cta-check"><span>✓</span><strong>Application ready</strong></div>
            </div>
        </div>
    </div>
</section>
