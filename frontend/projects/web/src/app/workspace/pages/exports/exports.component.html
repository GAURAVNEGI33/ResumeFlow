<article class="workspace-page exports-page">
  <header class="workspace-page__header">
    <section><p class="workspace-eyebrow">FILES</p><h1>Exports</h1><p>Your generated PDF and DOCX files will appear here.</p></section>
    <nav class="workspace-page__actions" aria-label="Export actions"><a routerLink="/documents" class="workspace-button workspace-button--primary"><mat-icon>description</mat-icon>Choose a document</a></nav>
  </header>
  <section class="workspace-empty workspace-panel">
    <mat-icon aria-hidden="true">download</mat-icon>
    <h2>Export from the editor</h2>
    <p>Open any document, check the live preview and use Export when it is ready. Export history will connect during the backend phase.</p>
    <a routerLink="/documents" class="workspace-button workspace-button--secondary">Browse documents</a>
  </section>
</article>
