<article class="workspace-page password-page">
  <header class="workspace-page__header"><section><p class="workspace-eyebrow">SECURITY</p><h1>Change password</h1><p>Choose a new password for your ResumeFlow account.</p></section></header>
  <form class="workspace-panel password-form" (ngSubmit)="submit()">
    <label class="workspace-field">Current password<input type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" required></label>
    <label class="workspace-field">New password<input type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" minlength="8" required></label>
    <label class="workspace-field">Confirm new password<input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" minlength="8" required></label>
    <p class="workspace-alert" [class.workspace-alert--error]="message && !message.startsWith('The form')" [class.workspace-alert--success]="message.startsWith('The form')" *ngIf="message" role="status">{{ message }}</p>
    <button type="submit" class="workspace-button workspace-button--primary">Update password</button>
  </form>
</article>
